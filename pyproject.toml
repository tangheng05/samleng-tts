[project]
name = "samleng-tts"
version = "0.1.0"
description = "Real-time, native-sounding Khmer TTS and an open benchmark"
readme = "README.md"
authors = [
    { name = "Tang Heng", email = "76139625+tangheng05@users.noreply.github.com" }
]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["khmer", "text-to-speech", "tts", "benchmark", "distillation", "low-resource"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Natural Language :: Khmer",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
requires-python = ">=3.11"
dependencies = [
    "datasets>=5.1.0",
    "jiwer>=4.0.0",
    "khmercut==0.2.0",
    "librosa>=0.11.0",
    "numpy>=2.4.6",
    "pandas>=3.1.1",
    "rapidfuzz>=3.14.6",
    "scipy>=1.17.1",
    "soundfile>=0.14.0",
    "tabulate>=0.10.0",
    "tha>=0.1.4",
    "torch>=2.15.0",
    "transformers>=5.22.1",
]

[project.urls]
Repository = "https://github.com/tangheng05/samleng-tts"
Benchmark = "https://huggingface.co/datasets/hengthegoat/khmertts-bench-v1"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.uv.build-backend]
module-name = "samleng"

[tool.uv.workspace]
# Model runners pin conflicting deps, so each keeps its own env and lockfile.
exclude = ["runners/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]
# E501: the formatter owns line length. RUF001-003: Khmer text looks "ambiguous" to ruff.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
