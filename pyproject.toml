[project]
name = "samleng-tts"
version = "0.1.0"
description = "Real-time, native-sounding Khmer TTS and an open benchmark"
readme = "README.md"
authors = [
    { name = "Tang Heng", email = "76139625+tangheng05@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "datasets>=5.1.0",
    "jiwer>=4.0.0",
    "librosa>=0.11.0",
    "numpy>=2.4.6",
    "pandas>=3.1.1",
    "scipy>=1.17.1",
    "soundfile>=0.14.0",
    "tabulate>=0.10.0",
    "tha>=0.1.4",
    "torch>=2.15.0",
    "transformers>=5.22.1",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.uv.build-backend]
module-name = "samleng"

[tool.uv.workspace]
# Model runners pin conflicting deps, so each keeps its own env and lockfile.
exclude = ["runners/*"]
